[project]
name = "pricepilot-backend"
version = "0.1.0"
description = "PricePilot local API (modular monolith): workspaces, suppliers and future procurement modules."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "platformdirs>=4.3",
]

[project.scripts]
pricepilot-api = "pricepilot.__main__:main"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricepilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF", "N", "PT", "DTZ", "T20"]
# Russian UI text legitimately contains Cyrillic letters that look like Latin ones.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # Starlette suggests a different HTTP client package for TestClient; httpx is kept deliberately.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
